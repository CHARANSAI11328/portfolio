<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS Portal — Charan Sai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/js/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #070A11;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    .orb-1 {
      position: absolute;
      top: 20%;
      left: 10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .orb-2 {
      position: absolute;
      bottom: 20%;
      right: 10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .back-link {
      position: absolute;
      top: 2rem;
      left: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #94A3B8;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: #FFFFFF; }
    .login-container {
      width: 100%;
      max-width: 420px;
      z-index: 10;
    }
    .header-box { text-align: center; margin-bottom: 2rem; }
    .logo-badge {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      color: #FFFFFF;
    }
    .title { font-size: 1.5rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.75rem; color: #94A3B8; margin-top: 0.35rem; }
    .subtitle span { color: #818CF8; font-weight: 600; }
    .card {
      background: rgba(15, 22, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.5rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      color: #64748B;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: 0.75rem;
      background: #090D16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: #FFFFFF;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert-error {
      background: rgba(159, 18, 57, 0.3);
      border: 1px solid rgba(225, 29, 72, 0.5);
      color: #FDA4AF;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem 0.75rem;
        justify-content: flex-start;
        padding-top: 3.5rem;
      }
      .back-link {
        top: 1rem;
        left: 1rem;
      }
      .card {
        padding: 1.5rem 1.15rem;
        border-radius: 1.25rem;
      }
      .title {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <a href="/" class="back-link">
    <i data-lucide="arrow-left"></i>
    <span>Return to Public Portfolio</span>
  </a>

  <div class="login-container">
    <div class="header-box">
      <div class="logo-badge">
        <i data-lucide="shield-check" style="width: 1.75rem; height: 1.75rem;"></i>
      </div>
      <h1 class="title">Admin CMS Portal</h1>
      <p class="subtitle">Private content administration for <span>charansai.website</span></p>
    </div>

    <div class="card">
      <div id="errorAlert" class="alert-error">
        <i data-lucide="alert-circle" style="width: 1rem; height: 1rem; shrink: 0;"></i>
        <span id="errorText">Invalid administrator credentials</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Admin Username or Email</label>
          <div class="input-wrapper">
            <i data-lucide="user"></i>
            <input type="text" id="email" required placeholder="Enter administrator username or email" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" id="password" required placeholder="••••••••••••" autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span>Sign In to Dashboard</span>
          <i data-lucide="arrow-right" style="width: 1rem; height: 1rem;"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Check if already authenticated
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/admin';
        }
      })
      .catch(() => {});


    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');
      const errorText = document.getElementById('errorText');

      errorAlert.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span>Verifying...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        if (data.token) {
          localStorage.setItem('charan_admin_token', data.token);
          sessionStorage.setItem('charan_admin_token', data.token);
        }

        window.location.href = '/admin';
      } catch (err) {
        errorText.textContent = err.message;
        errorAlert.style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Dashboard</span> <i data-lucide="arrow-right" style="width: 1rem; height: 1rem;"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
